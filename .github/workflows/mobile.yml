name: Mobile CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: cd mobile && flutter pub get

      - name: Analyze
        run: cd mobile && flutter analyze

      - name: Run tests
        run: cd mobile && flutter test

  build-apk:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: cd mobile && flutter pub get

      - name: Generate launcher icons (placeholder)
        run: |
          mkdir -p mobile/android/app/src/main/res/mipmap-hdpi
          mkdir -p mobile/android/app/src/main/res/mipmap-mdpi
          mkdir -p mobile/android/app/src/main/res/mipmap-xhdpi
          mkdir -p mobile/android/app/src/main/res/mipmap-xxhdpi
          mkdir -p mobile/android/app/src/main/res/mipmap-xxxhdpi
          # Copy placeholder icons from Flutter default
          cp $(flutter --version 2>/dev/null; find /opt/hostedtoolcache/flutter -name ic_launcher.png 2>/dev/null | head -1) \
            mobile/android/app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || \
          python3 -c "
          import struct, zlib
          def make_png(w,h):
            raw = b'\x00' + b'\x8b\x1a\x8b' * w
            raw = b''.join([b'\x00' + b'\x8b\x1a\x8b' * w for _ in range(h)])
            def chunk(t,d): c=zlib.crc32(t+d)&0xffffffff; return struct.pack('>I',len(d))+t+d+struct.pack('>I',c)
            data = b'\x89PNG\r\n\x1a\n'
            data += chunk(b'IHDR', struct.pack('>IIBBBBB',w,h,8,2,0,0,0))
            rows = b''.join(b'\x00'+b'\x8b\x1a\x8b'*w for _ in range(h))
            data += chunk(b'IDAT', zlib.compress(rows))
            data += chunk(b'IEND', b'')
            return data
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          import os
          for d,s in sizes.items():
            os.makedirs(f'mobile/android/app/src/main/res/{d}',exist_ok=True)
            open(f'mobile/android/app/src/main/res/{d}/ic_launcher.png','wb').write(make_png(s,s))
          "

      - name: Build debug APK
        run: cd mobile && flutter build apk --debug

      - name: Upload APK to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
        run: |
          APK_KEY="apk/al-safa-residence-${{ github.sha }}.apk"
          aws s3 cp mobile/build/app/outputs/flutter-apk/app-debug.apk \
            s3://al-safa-residence-uploads-590184057237/$APK_KEY
          echo "✅ APK uploaded to S3:"
          echo "https://al-safa-residence-uploads-590184057237.s3.eu-central-1.amazonaws.com/$APK_KEY"

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: al-safa-residence-${{ github.sha }}.apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3
