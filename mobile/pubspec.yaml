name: al_safa_residence
description: Al-Safa Residence — Digital property management for residents and security.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # HTTP
  dio: ^5.4.3+1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.1

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # Auth
  local_auth: ^2.3.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0

  # Animations
  flutter_animate: ^4.5.0

  # Utilities
  intl: ^0.19.0
  permission_handler: ^11.3.1

  # Sharing
  share_plus: ^10.0.3
  path_provider: ^2.1.4
  screenshot: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
